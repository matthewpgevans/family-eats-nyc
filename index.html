<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Eats NYC</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#faf9f7; color:#2d2d2d; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

    header { background:#fff; border-bottom:1px solid #eee; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; gap:16px; }
    .logo { display:flex; align-items:center; gap:10px; }
    .logo-icon { width:36px; height:36px; background:#ff6b6b; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; }
    .logo-text h1 { font-size:17px; font-weight:700; color:#1a1a1a; line-height:1; }
    .logo-text p { font-size:11px; color:#999; margin-top:2px; }
    .resy-badge-header { display:flex; align-items:center; gap:6px; background:#f9f0ee; border:1px solid #f0dbd9; border-radius:20px; padding:5px 12px; font-size:12px; color:#c0392b; font-weight:600; flex-shrink:0; }
    .resy-dot { width:8px; height:8px; border-radius:50%; background:#e74c3c; }

    .filters { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
    .filter-label { font-size:12px; color:#888; font-weight:500; }
    .filter-btn { padding:5px 13px; border-radius:20px; border:1.5px solid #e0e0e0; background:#fff; font-size:12px; cursor:pointer; color:#555; transition:all .15s; font-weight:500; }
    .filter-btn:hover { border-color:#ff6b6b; color:#ff6b6b; }
    .filter-btn.active { background:#ff6b6b; border-color:#ff6b6b; color:#fff; }
    .search-box { padding:6px 13px; border-radius:20px; border:1.5px solid #e0e0e0; background:#f8f8f8; font-size:12px; outline:none; width:190px; transition:border-color .15s; }
    .search-box:focus { border-color:#ff6b6b; background:#fff; }

    main { display:flex; flex:1; overflow:hidden; }

    .sidebar { width:370px; flex-shrink:0; background:#fff; border-right:1px solid #eee; display:flex; flex-direction:column; overflow:hidden; }
    .sidebar-header { padding:12px 16px 10px; border-bottom:1px solid #f0f0f0; flex-shrink:0; display:flex; align-items:baseline; justify-content:space-between; }
    .sidebar-header strong { font-size:13px; color:#333; }
    .sidebar-header span { font-size:11px; color:#bbb; }

    .restaurant-list { overflow-y:auto; flex:1; }
    .restaurant-list::-webkit-scrollbar { width:4px; }
    .restaurant-list::-webkit-scrollbar-thumb { background:#ddd; border-radius:4px; }

    .restaurant-card { padding:11px 16px; border-bottom:1px solid #f4f4f4; cursor:pointer; transition:background .1s; display:flex; gap:10px; align-items:flex-start; }
    .restaurant-card:hover { background:#fff8f8; }
    .restaurant-card.active { background:#fff0f0; border-left:3px solid #ff6b6b; padding-left:13px; }

    .rank-badge { width:24px; height:24px; border-radius:6px; background:#f5f5f5; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#bbb; flex-shrink:0; margin-top:2px; }
    .rank-badge.gold { background:#fff3e0; color:#e65100; }
    .rank-badge.red  { background:#fce4ec; color:#c62828; }

    .card-info { flex:1; min-width:0; }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
    .card-name { font-size:13px; font-weight:600; color:#1a1a1a; line-height:1.3; }
    .kid-score { display:flex; align-items:center; gap:3px; flex-shrink:0; }
    .score-dots { display:flex; gap:2px; }
    .dot { width:7px; height:7px; border-radius:50%; background:#e8e8e8; }
    .dot.filled { background:#ff6b6b; }
    .score-num { font-size:11px; font-weight:700; color:#ff6b6b; }

    .card-meta { display:flex; gap:5px; margin-top:3px; align-items:center; flex-wrap:wrap; }
    .tag { font-size:10px; color:#999; background:#f5f5f5; padding:1px 6px; border-radius:8px; }
    .neighborhood { font-size:10px; color:#bbb; }

    .card-bottom { margin-top:6px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
    .card-features { display:flex; gap:3px; flex-wrap:wrap; flex:1; }
    .fc { font-size:10px; padding:2px 6px; border-radius:6px; font-weight:500; }
    .fc-green  { background:#e8f5e9; color:#2e7d32; }
    .fc-blue   { background:#e3f2fd; color:#1565c0; }
    .fc-purple { background:#f3e5f5; color:#6a1b9a; }
    .fc-amber  { background:#fff8e1; color:#f57f17; }

    .resy-btn { display:inline-flex; align-items:center; gap:4px; padding:4px 9px; background:#e74c3c; color:#fff; border-radius:7px; font-size:10px; font-weight:700; text-decoration:none; flex-shrink:0; transition:background .15s; }
    .resy-btn:hover { background:#c0392b; }

    #map { flex:1; z-index:0; }

    .leaflet-popup-content-wrapper { border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.13); padding:0; }
    .leaflet-popup-content { margin:0; width:250px !important; }
    .popup-inner { padding:14px; }
    .popup-name { font-size:14px; font-weight:700; color:#1a1a1a; margin-bottom:3px; line-height:1.3; }
    .popup-sub { font-size:11px; color:#aaa; margin-bottom:7px; }
    .popup-score { display:flex; align-items:center; gap:5px; margin-bottom:7px; }
    .popup-score-label { font-size:11px; color:#bbb; }
    .popup-desc { font-size:12px; color:#555; line-height:1.5; margin-bottom:9px; }
    .popup-features { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; }
    .popup-resy-btn { display:flex; align-items:center; justify-content:center; gap:5px; width:100%; padding:7px; background:#e74c3c; color:#fff; border-radius:8px; font-size:12px; font-weight:700; text-decoration:none; transition:background .15s; }
    .popup-resy-btn:hover { background:#c0392b; }

    .empty-state { padding:40px 20px; text-align:center; color:#ccc; font-size:13px; }

    @media (max-width:700px) {
      body { overflow:auto; }
      main { flex-direction:column; overflow:visible; }
      .sidebar { width:100%; height:50vh; border-right:none; border-bottom:1px solid #eee; }
      #map { height:50vh; min-height:300px; }
      header { flex-wrap:wrap; }
      .resy-badge-header { display:none; }
    }
  </style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">🍕</div>
    <div class="logo-text">
      <h1>Family Eats NYC</h1>
      <p>100 kid-friendly restaurants, all bookable on Resy</p>
    </div>
  </div>
  <div class="filters">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="kids-menu">Kids Menu</button>
    <button class="filter-btn" data-filter="high-chairs">High Chairs</button>
    <button class="filter-btn" data-filter="quiet">Quieter</button>
    <button class="filter-btn" data-filter="brooklyn">Brooklyn</button>
    <input class="search-box" type="text" placeholder="Search name, area, cuisine..." id="searchInput" />
  </div>
  <div class="resy-badge-header"><div class="resy-dot"></div>Bookable on Resy</div>
</header>

<main>
  <aside class="sidebar">
    <div class="sidebar-header">
      <strong id="result-count">100 restaurants</strong>
      <span>Ranked by kid-friendliness</span>
    </div>
    <div class="restaurant-list" id="restaurantList"></div>
  </aside>
  <div id="map"></div>
</main>

<script>
const RESY = "https://resy.com/cities/new-york-ny";

const restaurants = [
  // ── Upper West Side ──
  {id:1,  name:"Maison Pickle",          neighborhood:"Upper West Side",      cuisine:"American",         score:5.0, lat:40.7844,lng:-73.9815, features:["Kids Menu","High Chairs","Family-Style"],       tags:["American","$$"],  desc:"UWS staple with enormous shareable portions. One of the city's best mac and cheese — warm and welcoming to all ages.", quiet:true,  resyUrl:RESY+"/venues/maison-pickle"},
  {id:2,  name:"Carmine's",              neighborhood:"Upper West Side",      cuisine:"Italian",          score:4.8, lat:40.7873,lng:-73.9811, features:["High Chairs","Family-Style","Large Tables"],     tags:["Italian","$$"],   desc:"Legendary family-style Italian. Giant platters of chicken parm and meatballs — spills and noise are expected.", quiet:false, resyUrl:RESY},
  {id:3,  name:"Osteria Cotta",          neighborhood:"Upper West Side",      cuisine:"Italian",          score:4.6, lat:40.7839,lng:-73.9796, features:["High Chairs","Wood-Fired","Cozy"],               tags:["Italian","$$"],   desc:"Homey trattoria on Columbus Ave with wood-fired dishes. The top-floor dining room is perfect for families.", quiet:true,  resyUrl:RESY},
  {id:4,  name:"Granola Bar",            neighborhood:"Upper West Side",      cuisine:"American Brunch",  score:4.5, lat:40.7896,lng:-73.9805, features:["Kids Menu","High Chairs","Smoothies"],           tags:["Brunch","$$"],    desc:"Family-centric brunch spot from the suburbs, now on the UWS. Sliders, parfaits, and cocktails for tired parents.", quiet:true,  resyUrl:RESY},
  {id:5,  name:"Sarabeth's Kitchen",     neighborhood:"Upper West Side",      cuisine:"American Brunch",  score:4.4, lat:40.7829,lng:-73.9801, features:["Kids Menu","High Chairs","Booster Seats"],       tags:["Brunch","$$"],    desc:"Iconic NYC brunch spot steps from Central Park. Famous lemon ricotta pancakes in a warm, family-friendly room.", quiet:true,  resyUrl:RESY},
  {id:6,  name:"Isabella's",             neighborhood:"Upper West Side",      cuisine:"American",         score:4.3, lat:40.7817,lng:-73.9798, features:["High Chairs","Outdoor Terrace","All-Day"],       tags:["American","$$"],  desc:"UWS fixture with a long outdoor terrace. Solid all-day menu and a relaxed setting that suits families well.", quiet:true,  resyUrl:RESY},
  {id:7,  name:"Jacob's Pickles",        neighborhood:"Upper West Side",      cuisine:"Southern American",score:4.2, lat:40.7881,lng:-73.9741, features:["Kids Menu","Large Tables","Casual"],             tags:["Southern","$$"],  desc:"Southern comfort food in a lively setting. Biscuits and fried chicken that kids devour. Loud and fun.", quiet:false, resyUrl:RESY},
  {id:8,  name:"Alice's Tea Cup Ch. II", neighborhood:"Upper West Side",      cuisine:"Tea Room",         score:4.2, lat:40.7793,lng:-73.9822, features:["Kids Menu","High Chairs","Scones & Tea"],        tags:["Brunch","$$"],    desc:"Whimsical Alice in Wonderland-themed tea room. Fairy-tale decor, scones, and a kids menu make it magical.", quiet:true,  resyUrl:RESY},
  {id:9,  name:"Cafe Luxembourg",        neighborhood:"Upper West Side",      cuisine:"French Bistro",    score:4.0, lat:40.7795,lng:-73.9841, features:["High Chairs","Classic Bistro","Brunch"],         tags:["French","$$"],    desc:"NYC bistro institution since 1983. Relaxed weekend brunch in a beautiful room near Lincoln Center.", quiet:true,  resyUrl:RESY},
  {id:10, name:"Bar Boulud",             neighborhood:"Upper West Side",      cuisine:"French",           score:4.0, lat:40.7735,lng:-73.9835, features:["Kids Menu","High Chairs","Charcuterie"],         tags:["French","$$$"],   desc:"Daniel Boulud's casual French spot. Upscale but genuinely accommodating to families, especially at lunch.", quiet:true,  resyUrl:RESY},

  // ── Upper East Side ──
  {id:11, name:"Serendipity 3",          neighborhood:"Upper East Side",      cuisine:"American Dessert", score:4.5, lat:40.7617,lng:-73.9660, features:["Kids Menu","High Chairs","Frozen Hot Choc"],    tags:["Dessert","$$"],   desc:"Famous since 1954 for legendary frozen hot chocolate. A NYC family rite of passage — whimsical and unforgettable.", quiet:false, resyUrl:RESY},
  {id:12, name:"Chez Nick",              neighborhood:"Upper East Side",      cuisine:"American",         score:4.4, lat:40.7758,lng:-73.9519, features:["Kids Menu","High Chairs","Near Park Playground"],tags:["American","$$"],  desc:"Charming corner bistro near Carl Schurz Park playground. Giant chocolate chip cookie with cold milk for dessert.", quiet:true,  resyUrl:RESY},
  {id:13, name:"Alice's Tea Cup Ch. I",  neighborhood:"Upper East Side",      cuisine:"Tea Room",         score:4.2, lat:40.7739,lng:-73.9567, features:["Kids Menu","High Chairs","Afternoon Tea"],       tags:["Brunch","$$"],    desc:"The original Alice's Tea Cup. Scones, waffles, pancakes, and fairy-tale decor kids absolutely adore.", quiet:true,  resyUrl:RESY},
  {id:14, name:"Prova Pizzabar",         neighborhood:"Upper East Side",      cuisine:"Pizza",            score:4.1, lat:40.7746,lng:-73.9581, features:["High Chairs","Casual","Weekend Brunch"],         tags:["Pizza","$$"],     desc:"Casual UES pizzeria with solid Neapolitan pies. Relaxed, unhurried vibe that works well for families.", quiet:true,  resyUrl:RESY},
  {id:15, name:"EJ's Luncheonette",      neighborhood:"Upper East Side",      cuisine:"American Diner",   score:4.0, lat:40.7701,lng:-73.9573, features:["Kids Menu","High Chairs","Diner Classics"],       tags:["Diner","$"],      desc:"Classic NYC diner on the UES. Pancakes, burgers, and milkshakes in a no-fuss, cheerful setting.", quiet:false, resyUrl:RESY},
  {id:16, name:"Cafe Sabarsky",          neighborhood:"Upper East Side",      cuisine:"Viennese",         score:4.0, lat:40.7820,lng:-73.9595, features:["High Chairs","Museum Cafe","Pastries"],          tags:["European","$$"],  desc:"Elegant Viennese cafe inside the Neue Galerie. The pastries and hot chocolate are perfect after a museum visit.", quiet:true,  resyUrl:RESY},
  {id:17, name:"Petaluma",               neighborhood:"Upper East Side",      cuisine:"American",         score:3.9, lat:40.7688,lng:-73.9615, features:["High Chairs","Pizza","All-Day Menu"],            tags:["American","$$"],  desc:"Reliable UES spot with a long all-day menu including good pizza and pasta for kids.", quiet:true,  resyUrl:RESY},

  // ── Midtown / Times Square ──
  {id:18, name:"Carmine's Times Square", neighborhood:"Times Square",         cuisine:"Italian",          score:4.8, lat:40.7605,lng:-73.9858, features:["High Chairs","Family-Style","Large Tables"],     tags:["Italian","$$"],   desc:"The Times Square Carmine's. Enormous family-style platters in a loud, lively room where kids fit right in.", quiet:false, resyUrl:RESY},
  {id:19, name:"Black Tap",              neighborhood:"Midtown",              cuisine:"American",         score:4.7, lat:40.7572,lng:-73.9902, features:["Kids Menu","High Chairs","CrazyShakes"],          tags:["Burgers","$$"],   desc:"Home of NYC's famous CrazyShakes — towering milkshakes loaded with cake and candy. Burgers and tenders too.", quiet:false, resyUrl:RESY},
  {id:20, name:"Junior's",               neighborhood:"Times Square",         cuisine:"American Diner",   score:4.1, lat:40.7561,lng:-73.9870, features:["Kids Menu","High Chairs","Famous Cheesecake"],    tags:["Diner","$$"],     desc:"NYC diner institution with a proper kids menu and the city's most celebrated cheesecake.", quiet:false, resyUrl:RESY},
  {id:21, name:"Pershing Square",        neighborhood:"Midtown East",         cuisine:"American",         score:3.9, lat:40.7527,lng:-73.9777, features:["High Chairs","Grand Cafe","All-Day"],            tags:["American","$$"],  desc:"Classic grand cafe across from Grand Central. Solid all-day menu in a spacious, buzzy setting.", quiet:false, resyUrl:RESY},

  // ── Chelsea ──
  {id:22, name:"Ootoya",                 neighborhood:"Chelsea",              cuisine:"Japanese",         score:4.6, lat:40.7399,lng:-73.9929, features:["Kids Menu","High Chairs","Okosama Sets"],         tags:["Japanese","$$"],  desc:"One of few NYC spots with okosama sets — colorful kid-sized Japanese meals. Moms with strollers flock here.", quiet:true,  resyUrl:RESY},
  {id:23, name:"Cookshop",               neighborhood:"Chelsea",              cuisine:"American",         score:4.0, lat:40.7482,lng:-74.0028, features:["Kids Menu","High Chairs","Outdoor Seating"],       tags:["American","$$"],  desc:"Farm-to-table American with a bright, open dining room and great brunch right by the High Line.", quiet:true,  resyUrl:RESY},
  {id:24, name:"Jack's Wife Freda Chelsea",neighborhood:"Chelsea",            cuisine:"Mediterranean",    score:4.2, lat:40.7449,lng:-74.0001, features:["High Chairs","All-Day Menu","Welcoming"],         tags:["Mediterranean","$$"],desc:"Chelsea outpost of the beloved all-day cafe. Same warm Mediterranean comfort food and staff who love families.", quiet:true,  resyUrl:RESY+"/venues/jacks-wife-freda-chelsea"},
  {id:25, name:"Trestle on Tenth",       neighborhood:"Chelsea",              cuisine:"American",         score:3.9, lat:40.7453,lng:-74.0030, features:["High Chairs","Seasonal Menu","Quiet"],            tags:["American","$$"],  desc:"Quiet Chelsea bistro with a thoughtful seasonal menu. More relaxed pacing — good for longer family meals.", quiet:true,  resyUrl:RESY},

  // ── Flatiron / Gramercy / Murray Hill ──
  {id:26, name:"Union Square Cafe",      neighborhood:"Flatiron",             cuisine:"American",         score:4.7, lat:40.7369,lng:-73.9882, features:["Kids Menu","High Chairs","Farm-to-Table"],        tags:["American","$$$"], desc:"NYC institution happy to serve kids pasta with butter. Many regular dishes suit children and the staff are warm.", quiet:true,  resyUrl:RESY},
  {id:27, name:"Adda Indian Canteen",    neighborhood:"East Village",         cuisine:"Indian",           score:4.4, lat:40.7249,lng:-73.9826, features:["Kids Menu","High Chairs","Innovative Indian"],     tags:["Indian","$$"],    desc:"Unapologetically honest Indian cooking. Kids love the paneer burgers on brioche buns at brunch.", quiet:true,  resyUrl:RESY},
  {id:28, name:"Eataly NYC Flatiron",    neighborhood:"Flatiron",             cuisine:"Italian Market",   score:4.1, lat:40.7418,lng:-73.9893, features:["High Chairs","Multiple Stations","Gelato"],       tags:["Italian","$$"],   desc:"Part Italian market, part restaurant complex. Pick pizza, pasta, or gelato — great for picky eaters.", quiet:false, resyUrl:RESY},
  {id:29, name:"Penelope",               neighborhood:"Murray Hill",          cuisine:"American Brunch",  score:4.3, lat:40.7459,lng:-73.9806, features:["Kids Menu","High Chairs","Cozy"],                 tags:["Brunch","$$"],    desc:"Cozy all-day cafe with a kids menu and warm, homey atmosphere. One of Murray Hill's best weekend brunch spots.", quiet:true,  resyUrl:RESY},
  {id:30, name:"Almond",                 neighborhood:"Flatiron",             cuisine:"American",         score:4.0, lat:40.7404,lng:-73.9889, features:["High Chairs","Seasonal Menu","Welcoming"],         tags:["American","$$"],  desc:"Warm Flatiron bistro with a seasonal menu and staff who are notably welcoming to families.", quiet:true,  resyUrl:RESY},
  {id:31, name:"Tacombi",                neighborhood:"Flatiron",             cuisine:"Mexican",          score:4.2, lat:40.7411,lng:-73.9896, features:["Kids Menu","High Chairs","Tacos"],                 tags:["Mexican","$"],    desc:"Bright, casual Mexican taqueria with a genuine kids menu. Tacos and quesadillas in a festive colorful setting.", quiet:false, resyUrl:RESY},

  // ── West Village / Greenwich Village ──
  {id:32, name:"Cowgirl",                neighborhood:"West Village",         cuisine:"Tex-Mex",          score:4.7, lat:40.7338,lng:-74.0066, features:["Kids Menu","High Chairs","Outdoor Seating"],       tags:["Tex-Mex","$"],    desc:"Texas hospitality in the West Village since 1989. Corn dogs, Frito pie, and lively brunch energy kids love.", quiet:false, resyUrl:RESY},
  {id:33, name:"Jack's Wife Freda WV",   neighborhood:"West Village",         cuisine:"Mediterranean",    score:4.2, lat:40.7323,lng:-74.0025, features:["High Chairs","All-Day Menu","Welcoming"],         tags:["Mediterranean","$$"],desc:"West Village outpost of the beloved all-day cafe. Same warm Mediterranean comfort food formula.", quiet:true,  resyUrl:RESY+"/venues/jacks-wife-freda-west-village"},
  {id:34, name:"Westville Hudson",       neighborhood:"West Village",         cuisine:"American",         score:4.0, lat:40.7353,lng:-74.0063, features:["Kids Menu","High Chairs","Vegetable-Forward"],     tags:["Healthy","$$"],   desc:"Market-driven comfort food with a proper kids menu. Good for health-conscious parents without sacrificing taste.", quiet:true,  resyUrl:RESY},
  {id:35, name:"Rosemary's",             neighborhood:"West Village",         cuisine:"Italian",          score:4.1, lat:40.7345,lng:-74.0030, features:["High Chairs","Rooftop Garden","Italian"],          tags:["Italian","$$"],   desc:"Italian with a rooftop herb garden and warm neighborhood vibe. Great pasta and a weekend brunch for families.", quiet:true,  resyUrl:RESY},
  {id:36, name:"Taqueria Diana",         neighborhood:"West Village",         cuisine:"Mexican",          score:4.2, lat:40.7345,lng:-74.0043, features:["Kids Menu","Casual","Fast Tacos"],                 tags:["Mexican","$"],    desc:"Casual counter-service tacos done right. Quick, affordable, and loved by kids — the best kind of dinner.", quiet:false, resyUrl:RESY},
  {id:37, name:"Emily",                  neighborhood:"West Village",         cuisine:"Pizza & Burgers",  score:4.1, lat:40.7341,lng:-74.0064, features:["Kids Menu","High Chairs","Detroit-Style Pizza"],    tags:["Pizza","$$"],     desc:"Detroit-style pizza and the famous Emmy Burger. A weekend family favorite in the West Village.", quiet:false, resyUrl:RESY},
  {id:38, name:"The Little Owl",         neighborhood:"West Village",         cuisine:"American",         score:4.0, lat:40.7334,lng:-74.0052, features:["High Chairs","Weekend Brunch","Cozy"],             tags:["American","$$"],  desc:"Charming corner bistro with a great brunch. Small and intimate — best for families with calmer kids.", quiet:true,  resyUrl:RESY},
  {id:39, name:"Joseph Leonard",         neighborhood:"West Village",         cuisine:"American",         score:4.1, lat:40.7330,lng:-74.0030, features:["High Chairs","Seasonal Menu","Brunch"],            tags:["American","$$"],  desc:"Charming neighborhood bistro with seasonal cooking. Relaxed brunch and dinner that works well for families.", quiet:true,  resyUrl:RESY},
  {id:40, name:"Buvette",                neighborhood:"West Village",         cuisine:"French",           score:4.0, lat:40.7330,lng:-74.0041, features:["High Chairs","Brunch","Cozy"],                    tags:["French","$$"],    desc:"Intimate French bistrot great for weekend brunch. Cozy and warm — best for families with well-behaved little ones.", quiet:true,  resyUrl:RESY},
  {id:41, name:"Don Angie",              neighborhood:"West Village",         cuisine:"Italian-American", score:4.0, lat:40.7353,lng:-74.0033, features:["High Chairs","Creative Italian","Buzzy"],          tags:["Italian","$$"],   desc:"Modern Italian-American with creative comfort classics. Lively and buzzy but accommodating to families.", quiet:false, resyUrl:RESY},
  {id:42, name:"Jane",                   neighborhood:"Greenwich Village",    cuisine:"American",         score:4.2, lat:40.7272,lng:-74.0020, features:["Kids Menu","High Chairs","Brunch"],                tags:["American","$$"],  desc:"Neighborhood bistro with a welcoming all-day menu. Reliable brunch and a laid-back atmosphere great for families.", quiet:true,  resyUrl:RESY},

// ── Helpers ──
function scoreColor(s) {
  if (s >= 4.7) return '#e53935';
  if (s >= 4.3) return '#ff6b6b';
  if (s >= 4.0) return '#ff8a65';
  return '#ffb74d';
}

function renderDots(score) {
  const f = Math.round(score);
  return '<div class="score-dots">' + [1,2,3,4,5].map(i=>`<div class="dot${i<=f?' filled':''}"></div>`).join('') + '</div>';
}

function chipCls(f) {
  const blue   = ['Stroller Parking','All-Day','Outdoor Seating','Outdoor Terrace','Bridge Views','Waterfront','Museum Cafe','Sidewalk Patio','Outdoor Space','Beer Garden'];
  const purple = ['Family-Style','Wood-Fired','Creative Dim Sum','Fine-Casual','Detroit-Style Pizza','Okosama Sets','Rooftop Garden','Beautiful Garden','Coal-Fired Pizza'];
  const amber  = ['Gelato','Gelato Counter','CrazyShakes','Frozen Hot Choc','S\'mores Cake','Gachapon Machine','Famous Cheesecake','Scones & Tea','Afternoon Tea'];
  if (blue.some(x=>f.includes(x)))   return 'fc fc-blue';
  if (purple.some(x=>f.includes(x))) return 'fc fc-purple';
  if (amber.some(x=>f.includes(x)))  return 'fc fc-amber';
  return 'fc fc-green';
}

// ── Map ──
const map = L.map('map',{zoomControl:true}).setView([40.730,-73.990],12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom:19
}).addTo(map);

const markers = {};
let activeCard = null;

function markerIcon(rank, score) {
  const c = scoreColor(score);
  return L.divIcon({
    className:'',
    html:`<div style="width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${c};display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)"><span style="transform:rotate(45deg);font-size:10px;font-weight:700;color:#fff">${rank}</span></div>`,
    iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-28]
  });
}

function buildPopup(r) {
  return `<div class="popup-inner">
    <div class="popup-name">${r.name}</div>
    <div class="popup-sub">${r.neighborhood} &middot; ${r.tags.join(' &middot; ')}</div>
    <div class="popup-score">${renderDots(r.score)}<span class="score-num">${r.score.toFixed(1)}</span><span class="popup-score-label">kid-friendly</span></div>
    <div class="popup-desc">${r.desc}</div>
    <div class="popup-features">${r.features.map(f=>`<span class="${chipCls(f)}">${f}</span>`).join('')}</div>
    <a class="popup-resy-btn" href="${r.resyUrl}" target="_blank" rel="noopener">Book on Resy</a>
  </div>`;
}

function renderMarkers(list) {
  Object.values(markers).forEach(m=>map.removeLayer(m));
  Object.keys(markers).forEach(k=>delete markers[k]);
  list.forEach((r,i)=>{
    const m = L.marker([r.lat,r.lng],{icon:markerIcon(i+1,r.score)})
      .addTo(map).bindPopup(buildPopup(r),{maxWidth:270,minWidth:250});
    m.on('click',()=>{
      document.querySelectorAll('.restaurant-card').forEach(c=>c.classList.remove('active'));
      const card = document.getElementById(`card-${r.id}`);
      if(card){card.classList.add('active');card.scrollIntoView({behavior:'smooth',block:'nearest'});}
      activeCard=r.id;
    });
    markers[r.id]=m;
  });
}

function renderList(list) {
  document.getElementById('result-count').textContent=`${list.length} restaurant${list.length!==1?'s':''}`;
  const c=document.getElementById('restaurantList');
  if(!list.length){c.innerHTML='<div class="empty-state">No restaurants match your search.</div>';return;}
  c.innerHTML=list.map((r,i)=>{
    const rank=i+1;
    const bc=rank===1?'rank-badge gold':rank<=3?'rank-badge red':'rank-badge';
    return `<div class="restaurant-card" data-id="${r.id}" id="card-${r.id}">
      <div class="${bc}">${rank}</div>
      <div class="card-info">
        <div class="card-top">
          <div class="card-name">${r.name}</div>
          <div class="kid-score">${renderDots(r.score)}<span class="score-num">${r.score.toFixed(1)}</span></div>
        </div>
        <div class="card-meta">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}<span class="neighborhood">${r.neighborhood}</span></div>
        <div class="card-bottom">
          <div class="card-features">${r.features.slice(0,3).map(f=>`<span class="${chipCls(f)}">${f}</span>`).join('')}</div>
          <a class="resy-btn" href="${r.resyUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Resy</a>
        </div>
      </div>
    </div>`;
  }).join('');
  c.querySelectorAll('.restaurant-card').forEach(card=>{
    card.addEventListener('click',()=>focusRestaurant(parseInt(card.dataset.id)));
  });
}

function focusRestaurant(id) {
  if(activeCard){const p=document.getElementById(`card-${activeCard}`);if(p)p.classList.remove('active');}
  activeCard=id;
  const card=document.getElementById(`card-${id}`);
  if(card){card.classList.add('active');card.scrollIntoView({behavior:'smooth',block:'nearest'});}
  const r=restaurants.find(x=>x.id===id);
  if(r&&markers[id]){map.setView([r.lat,r.lng],15,{animate:true});markers[id].openPopup();}
}

function applyFilters() {
  const af=document.querySelector('.filter-btn.active')?.dataset.filter||'all';
  const s=document.getElementById('searchInput').value.toLowerCase();
  const filtered=restaurants.filter(r=>{
    const ms=!s||r.name.toLowerCase().includes(s)||r.neighborhood.toLowerCase().includes(s)||r.cuisine.toLowerCase().includes(s)||r.tags.some(t=>t.toLowerCase().includes(s));
    let mf=true;
    if(af==='kids-menu')   mf=r.features.some(f=>f==='Kids Menu'||f==='Kids Dinner Menu'||f==='Kids Breakfast Menu');
    if(af==='high-chairs') mf=r.features.some(f=>f.includes('High Chair'));
    if(af==='quiet')       mf=r.quiet===true;
    if(af==='brooklyn')    mf=r.neighborhood.includes('Brooklyn')||r.neighborhood.includes('Bklyn');
    return ms&&mf;
  });
  renderList(filtered);
  renderMarkers(filtered);
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  });
});
document.getElementById('searchInput').addEventListener('input',applyFilters);

renderList(restaurants);
renderMarkers(restaurants);
</script>
</body>
</html>
